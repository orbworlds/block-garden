const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="#f0a020" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#ffd44d"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#ffe9a8"/></svg>';
function toggleNight() { nightTarget = nightTarget ? 0 : 1; $('night').innerHTML = nightTarget ? MOON : SUN; document.body.classList.toggle('night', !!nightTarget); }
$('night').innerHTML = SUN; $('night').onclick = toggleNight;
let resetArm = 0;
$('reset').onclick = () => {
  if (!resetArm) { $('reset').textContent = 'Sure?'; resetArm = setTimeout(() => { resetArm = 0; $('reset').textContent = 'Reset'; }, 2500); return; }
  clearTimeout(resetArm); resetArm = 0; $('reset').textContent = 'Reset';
  starterWorld(); rebuild(); save(); burst(S / 2, G + 2, S / 2, LEAVES, 30, 7); orb?.toast?.('Fresh plot!');
};
const touch = matchMedia('(pointer: coarse)').matches;
$('hint').innerHTML = touch ? '<b>Tap</b> to place · <b>hold</b> to erase<br><b>Drag</b> to turn · <b>pinch</b> to zoom'
  : '<b>Click</b> to place · <b>right-click</b> to erase<br><b>Drag</b> to turn · <b>1–9</b> pick a block';
let hintGone = false;
function hintDone() { if (hintGone) return; hintGone = true; setTimeout(() => { $('hint').style.opacity = 0; }, 2500); }
setTimeout(hintDone, 6000);
setTimeout(() => orb?.capture?.(), 2500);

// === LOOP ===
const timer = new THREE.Timer();
timer.connect(document);
let lightTick = 0;
renderer.setAnimationLoop((now) => {
  timer.update(now);
  const raw = Math.max(timer.getDelta(), 0), dt = Math.min(raw, 0.05), t = timer.getElapsed();
  if (Math.abs(nightTarget - night) > 0.001) { night += Math.sign(nightTarget - night) * Math.min(Math.abs(nightTarget - night), Math.min(raw, 0.3) * 0.9); applyNight(night * night * (3 - 2 * night)); }
  controls.update(dt);
  controls.target.clamp(V.set(-S / 2, -4, -S / 2), V2.set(S / 2, H - G, S / 2));
  sky.position.copy(camera.position);
  sun.target.position.set(0, 0, 0);
  windU.value = t;
  if (++lightTick % 30 === 0 && night > 0) assignLights();
  puffs.forEach((p, i) => { const c = clouds[p[0]]; M4.makeScale(p[4], p[5], p[6]).setPosition(c.x + p[1], c.y + p[2], c.z + p[3]); cloudMesh.setMatrixAt(i, M4); });
  for (const c of clouds) { c.x += c.v * dt; if (c.x > 150) c.x = -150; }
  cloudMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < CONFIG.motes; i++) {
    motePos[i * 3] = moteBase[i * 3] + Math.sin(t * 0.3 + i) * 1.6;
    motePos[i * 3 + 1] = moteBase[i * 3 + 1] + Math.sin(t * 0.5 + i * 1.7) * 0.8;
    motePos[i * 3 + 2] = moteBase[i * 3 + 2] + Math.cos(t * 0.27 + i * 0.6) * 1.6;
  }
  motes.geometry.attributes.position.needsUpdate = true;
  let alive = false;
  for (let i = 0; i < PMAX; i++) {
    if (pl[i] <= 0) continue;
    pl[i] -= dt; alive = true;
    pv[i * 3 + 1] -= 16 * dt;
    pp[i * 3] += pv[i * 3] * dt; pp[i * 3 + 1] += pv[i * 3 + 1] * dt; pp[i * 3 + 2] += pv[i * 3 + 2] * dt;
    const s = Math.max(pl[i], 0) * 1.6;
    parts.setMatrixAt(i, M4.makeScale(s, s, s).setPosition(pp[i * 3], pp[i * 3 + 1], pp[i * 3 + 2]));
  }
  if (alive) parts.instanceMatrix.needsUpdate = true;
  if (pop.visible) {
    popT = Math.min(popT + dt / 0.22, 1); const s = 1 + 0.2 * (1 - popT) ** 2;
    pop.scale.set(s, s, s); pop.visible = popT < 1;
  }
  renderer.render(scene, camera);
});
applyNight(0);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
